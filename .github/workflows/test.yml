name: CI

# Runs on every push and every pull-request against master/main.
#
# The full test suite is fully mocked: no microphone, no speakers, no
# GPU, no Piper voice, no Ollama server, no Groq API key are required —
# every external dependency is faked inside the tests.

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: "Test — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -q

  gui-smoke:
    name: "GUI smoke — Python 3.12"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0

      - name: Install dependencies + GUI extra
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install "PySide6>=6.6" "PyOpenGL>=3.1" "psutil>=5.9"

      - name: GUI import smoke test (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/test_gui_import.py -q
