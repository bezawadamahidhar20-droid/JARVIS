name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache Hugging Face Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check all modules
        run: |
          python -m compileall ai audio commands speech utils main.py config.py

      - name: Generate a sample WAV for the Whisper benchmark
        run: |
          python - <<'EOF'
          import numpy as np
          from scipy.io.wavfile import write

          sr = 16000
          t = np.arange(sr) / sr  # 1 second
          tone = 0.3 * np.sin(2 * np.pi * 220 * t)
          write("sample_bench.wav", sr, (tone * 32767).astype(np.int16))
          print("wrote sample_bench.wav")
          EOF

      - name: Run router test (offline, no execution)
        run: python test_router.py

      - name: Run Whisper benchmark against sample WAV
        run: python test_benchmark.py sample_bench.wav