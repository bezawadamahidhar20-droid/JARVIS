<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0a1228"/>
      <stop offset="60%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cyP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="760" height="520" fill="url(#bg)"/>

  <!-- Voice waveform -->
  <path d="M40 130 Q 80 40 120 130 T 200 130 T 280 130 T 360 130 T 440 130 T 520 130 T 600 130 T 680 130 T 720 130" fill="none" stroke="url(#wave)" stroke-width="3.5" filter="url(#glow)">
    <animate attributeName="d" dur="3s" repeatCount="indefinite"
      values="M40 130 Q 80 40 120 130 T 200 130 T 280 130 T 360 130 T 440 130 T 520 130 T 600 130 T 680 130 T 720 130;
              M40 130 Q 80 220 120 130 T 200 130 T 280 130 T 360 130 T 440 130 T 520 130 T 600 130 T 680 130 T 720 130;
              M40 130 Q 80 40 120 130 T 200 130 T 280 130 T 360 130 T 440 130 T 520 130 T 600 130 T 680 130 T 720 130"/>
  </path>
  <text x="380" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#67e8f9">YOUR VOICE</text>

  <!-- Arrow to microphone -->
  <line x1="380" y1="150" x2="380" y2="185" stroke="#67e8f9" stroke-width="2.5"/>
  <polygon points="374,188 380,200 386,188" fill="#67e8f9"/>

  <text x="380" y="85" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">stream → 16 kHz · float32</text>

  <!-- MICROPHONE -->
  <rect x="220" y="205" width="320" height="52" rx="12" fill="#0f1c3a" stroke="url(#cyP)" stroke-width="1.6"/>
  <text x="380" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#67e8f9">🎤 MICROPHONE CAPTURE</text>

  <line x1="380" y1="257" x2="380" y2="282" stroke="#c4b5fd" stroke-width="2.5"/>
  <polygon points="374,285 380,297 386,285" fill="#c4b5fd"/>

  <!-- VAD -->
  <rect x="220" y="302" width="320" height="52" rx="12" fill="#0f1c3a" stroke="url(#cyP)" stroke-width="1.6"/>
  <text x="380" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#c4b5fd">🔇 ADAPTIVE VAD</text>

  <line x1="380" y1="354" x2="380" y2="379" stroke="#67e8f9" stroke-width="2.5"/>
  <polygon points="374,382 380,394 386,382" fill="#67e8f9"/>

  <!-- WHISPER -->
  <rect x="220" y="399" width="320" height="52" rx="12" fill="#0f1c3a" stroke="url(#cyP)" stroke-width="1.6"/>
  <text x="380" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#67e8f9">📝 FASTER-WHISPER → TEXT</text>

  <!-- Bottom hint -->
  <text x="380" y="495" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#94a3b8">clean, segmented speech → transcribed text</text>
</svg>