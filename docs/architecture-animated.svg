<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="720" height="980" viewBox="0 0 720 980">
  <defs>
    <radialGradient id="bg" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0a1228"/>
      <stop offset="60%" stop-color="#050b18"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="node1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1c3a"/>
      <stop offset="100%" stop-color="#0a1228"/>
    </linearGradient>
    <linearGradient id="nodeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#67e8f9"/>
    </marker>
  </defs>

  <rect width="720" height="980" fill="url(#bg)"/>

  <!-- Title -->
  <text x="360" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="4" fill="#e2e8f0">JARVIS PIPELINE</text>
  <line x1="250" y1="66" x2="470" y2="66" stroke="url(#nodeCyan)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Helper: node macro shapes -->

  <!-- MICROPHONE -->
  <rect x="220" y="100" width="280" height="66" rx="14" fill="url(#node1)" stroke="url(#nodeCyan)" stroke-width="1.8"/>
  <text x="360" y="127" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#67e8f9">🎤 MICROPHONE</text>
  <text x="360" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">sounddevice · 16 kHz · int16</text>

  <!-- Arrow 1 -->
  <line x1="360" y1="166" x2="360" y2="215" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <text x="380" y="194" font-family="Consolas, monospace" font-size="10.5" fill="#67e8f9">stream</text>

  <!-- SPEECH DETECTION -->
  <rect x="220" y="220" width="280" height="66" rx="14" fill="url(#node1)" stroke="url(#nodePurple)" stroke-width="1.8"/>
  <text x="360" y="247" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#c4b5fd">🔇 SPEECH DETECTION</text>
  <text x="360" y="270" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">RMS threshold · silence cut-off</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="286" x2="360" y2="335" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <text x="380" y="314" font-family="Consolas, monospace" font-size="10.5" fill="#c4b5fd">utterance</text>

  <!-- GOOGLE STT -->
  <rect x="220" y="340" width="280" height="66" rx="14" fill="url(#node1)" stroke="url(#nodeCyan)" stroke-width="1.8"/>
  <text x="360" y="367" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#67e8f9">📝 GOOGLE STT</text>
  <text x="360" y="390" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">raw PCM · HTTP · no PyAudio/FLAC</text>

  <!-- Arrow 3 -->
  <line x1="360" y1="406" x2="360" y2="455" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <text x="380" y="434" font-family="Consolas, monospace" font-size="10.5" fill="#67e8f9">text</text>

  <!-- COMMAND ROUTER -->
  <rect x="220" y="460" width="280" height="66" rx="14" fill="url(#node1)" stroke="url(#nodeGreen)" stroke-width="1.8"/>
  <text x="360" y="487" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#6ee7b7">🧭 COMMAND ROUTER</text>
  <text x="360" y="510" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">deterministic match</text>

  <!-- Branch: left to LOCAL COMMAND, right to LLAMA3.2 -->
  <path d="M340 526 L340 570 L130 570 L130 620" fill="none" stroke="url(#nodeGreen)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M380 526 L380 570 L590 570 L590 620" fill="none" stroke="url(#nodeAmber)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="130" y="600" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6ee7b7">matched</text>
  <text x="590" y="600" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#fcd34d">no match</text>

  <!-- LOCAL COMMAND -->
  <rect x="20" y="625" width="220" height="66" rx="14" fill="url(#node1)" stroke="url(#nodeGreen)" stroke-width="1.8"/>
  <text x="130" y="652" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6ee7b7">💻 LOCAL COMMAND</text>
  <text x="130" y="675" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">time · date · apps</text>

  <!-- LLAMA3.2 -->
  <rect x="480" y="625" width="220" height="66" rx="14" fill="url(#node1)" stroke="url(#nodeAmber)" stroke-width="1.8"/>
  <text x="590" y="652" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fcd34d">🤖 LLAMA3.2 · OLLAMA</text>
  <text x="590" y="675" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">local LLM · 3B</text>

  <!-- Merge back to TTS -->
  <path d="M130 691 L130 740 L360 740 L360 770" fill="none" stroke="url(#nodeGreen)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M590 691 L590 740 L360 740 L360 770" fill="none" stroke="url(#nodeAmber)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </path>

  <!-- RESPONSE note -->
  <text x="360" y="758" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">response</text>

  <!-- TTS -->
  <rect x="220" y="775" width="280" height="66" rx="14" fill="url(#node1)" stroke="url(#nodePurple)" stroke-width="1.8"/>
  <text x="360" y="802" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#c4b5fd">🔊 pyttsx3 TTS</text>
  <text x="360" y="825" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">Windows SAPI5 · queue + worker</text>

  <!-- Arrow final -->
  <line x1="360" y1="841" x2="360" y2="895" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrowhead)">
    <animate attributeName="stroke-dashoffset" from="34" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- SPEAKER -->
  <rect x="220" y="900" width="280" height="66" rx="14" fill="url(#node1)" stroke="url(#nodeCyan)" stroke-width="1.8"/>
  <text x="360" y="927" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#67e8f9">🔊 SPEAKER</text>
  <text x="360" y="950" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#94a3b8">you hear JARVIS</text>
</svg>