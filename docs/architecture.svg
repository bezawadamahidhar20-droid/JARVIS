<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="500" fill="url(#bg)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#f3f4f6">JARVIS — Voice Assistant Architecture</text>
  <line x1="420" y1="70" x2="780" y2="70" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="35" y="150" width="190" height="110" rx="14" fill="url(#box)" stroke="#22d3ee" stroke-width="2"/>
    <text x="130" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#22d3ee">Microphone</text>
    <text x="130" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">SoundDevice</text>
    <text x="130" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">16 kHz · float32</text>
  </g>
  <text x="262" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#22d3ee">→</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="285" y="150" width="190" height="110" rx="14" fill="url(#box)" stroke="#a78bfa" stroke-width="2"/>
    <text x="380" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#a78bfa">Adaptive VAD</text>
    <text x="380" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">RMS + noise-EMA</text>
    <text x="380" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">speech start / stop</text>
  </g>
  <text x="512" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#a78bfa">→</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="535" y="150" width="190" height="110" rx="14" fill="url(#box)" stroke="#34d399" stroke-width="2"/>
    <text x="630" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#34d399">Faster-Whisper</text>
    <text x="630" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">speech → text</text>
    <text x="630" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">int8 · on-device</text>
  </g>
  <text x="762" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#34d399">→</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="785" y="150" width="190" height="110" rx="14" fill="url(#box)" stroke="#fbbf24" stroke-width="2"/>
    <text x="880" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#fbbf24">Router / llama3.2</text>
    <text x="880" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">local commands</text>
    <text x="880" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">Ollama fallback</text>
  </g>
  <text x="1012" y="207" text-anchor="middle" font-family="Consolas, monospace" font-size="22" fill="#fbbf24">→</text>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect x="1035" y="150" width="130" height="110" rx="14" fill="url(#box)" stroke="#f472b6" stroke-width="2"/>
    <text x="1100" y="190" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#f472b6">Piper TTS</text>
    <text x="1100" y="216" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">text → voice</text>
    <text x="1100" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#9ca3af">ONNX · offline</text>
  </g>

  <!-- Footer note -->
  <rect x="60" y="330" width="1080" height="110" rx="12" fill="url(#box)" stroke="#374151" stroke-width="1.5"/>
  <text x="100" y="365" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#f3f4f6">Zero cloud dependency — everything runs locally on your machine.</text>
  <text x="100" y="395" font-family="Segoe UI, Arial" font-size="13.5" fill="#9ca3af">Speech is captured in memory (never written to disk), transcribed with Faster-Whisper,</text>
  <text x="100" y="418" font-family="Segoe UI, Arial" font-size="13.5" fill="#9ca3af">answered by a fixed command router with a llama3.2 fallback, and spoken aloud with Piper.</text>
</svg>