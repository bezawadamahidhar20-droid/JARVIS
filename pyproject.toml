[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "2.0.0"
description = "JARVIS — a private, local AI voice assistant for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Mirrors requirements.txt (pinned). numpy is a range because a single
# version cannot span the supported Python range (1.26.x covers 3.10-3.12;
# 2.2.x supports 3.10; 2.5.x supports 3.12-3.14).
dependencies = [
    "faster-whisper==1.1.0",
    "piper-tts==1.2.0",
    "sounddevice==0.5.0",
    "numpy>=1.26.0,<2.0.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "pyautogui==0.9.54",
    "pillow==10.4.0",
    "pycaw==20240210",
    "comtypes==1.4.14",
    "rich==13.7.1",
    "SpeechRecognition==3.10.4",
    "pyttsx3==2.90",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.3", "hypothesis>=6.100,<7"]
gui = ["PySide6>=6.6", "PyOpenGL>=3.1", "psutil>=5.9"]

[project.scripts]
jarvis = "jarvis_cli:main"

[tool.setuptools]
packages = ["jarvis_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # sounddevice 0.5.x uses the deprecated `array.shape = ...` idiom.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
# jarvis_ui carries pre-existing OpenGL painting debt that is out of
# scope here; linting focuses on the core runtime + tests.
# Notebooks are not Python modules (E401 in a %%capture cell).
extend-exclude = ["jarvis_ui/**", "*.ipynb"]

[tool.ruff.lint]
# F = pyflakes (real bugs: unused imports, undefined names)
# E4/E7/E9 = syntax-adjacent style that catches genuine mistakes
select = ["F", "E4", "E7", "E9"]
