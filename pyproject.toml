[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
 
[project]
name = "jarvis-assistant"
version = "2.0.1"
description = "JARVIS — a private, local AI voice assistant for Windows/Linux/macOS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
 
# [FIX C1+C2] Unified with requirements.txt. NumPy <2.0 for audio compatibility.
dependencies = [
    "faster-whisper==1.1.0",
    "piper-tts==1.2.0",
    "sounddevice==0.5.0",
    "numpy>=1.26.0,<2.0.0",
    "requests==2.32.3",
    "python-dotenv==1.0.1",
    "pyautogui==0.9.54",
    "pillow==10.4.0",
    "pycaw==20240210",
    "comtypes==1.4.14",
    "rich==13.7.1",
]
 
[project.optional-dependencies]
# [FIX M8] pyttsx3 is optional fallback TTS (Windows SAPI5)
fallback-tts = ["pyttsx3==2.90"]
dev = ["pytest==8.0.0", "ruff==0.3.0", "hypothesis>=6.100,<7"]
gui = ["PySide6>=6.6", "PyOpenGL>=3.1", "psutil>=5.9"]
 
[project.scripts]
jarvis = "jarvis_cli:main"
 
[tool.setuptools]
packages = ["jarvis_cli"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
 
[tool.ruff]
target-version = "py310"
extend-exclude = ["jarvis_ui/**", "*.ipynb"]
 
[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]
 