[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "2.0.0"
description = "JARVIS — a private, local AI voice assistant for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "sounddevice>=0.5",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyautogui>=0.9",
    "pillow>=10",
    "rich>=13",
    "SpeechRecognition>=3.10",
    "pyttsx3>=2.90",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
gui = ["PySide6>=6.6", "PyOpenGL>=3.1", "psutil>=5.9"]

[project.scripts]
jarvis = "jarvis_cli:main"

[tool.setuptools]
packages = ["jarvis_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # sounddevice 0.5.x uses the deprecated `array.shape = ...` idiom.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]
